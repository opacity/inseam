<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>inse.am</title>
<link rel="icon" type="image/png" href="inseam/tabicon.png" />
<script src="https://js.stripe.com/v3/"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    color: #1a1a1a;
    overflow-x: hidden;
    position: relative;
  }

  /* Header */
  header {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 60px;
    position: sticky;
    top: 0;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(16px);
    z-index: 100;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  }

  header.scrolled {
    padding: 20px 60px;
  }

  body.dark-mode header {
    background: rgba(15, 15, 15, 0.9);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  /* Mode Toggle */
  #toggle-mode {
    height: 44px;
    position: absolute;
    left: 60px;
    cursor: pointer;
    z-index: 101;
    opacity: 0.7;
    transition: opacity 0.3s ease;
  }

  #toggle-mode:hover {
    opacity: 1;
  }

  /* Logo */
  #logo {
    height: 90px;
    max-width: 550px;
    width: auto;
    object-fit: contain;
    cursor: pointer;
  }

  header.scrolled #logo {
    height: 70px;
  }

  /* Cart Badge */
  #cart-wrapper {
    position: fixed;
    top: 32px;
    right: 60px;
    z-index: 101;
  }

  #cart {
    height: 40px;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.3s ease;
  }

  #cart:hover {
    opacity: 1;
  }

  #cart-count {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #1a1a1a;
    color: white;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  body.dark-mode #cart-count {
    background: #f0f0f0;
    color: #1a1a1a;
  }

  #cart-count.show {
    opacity: 1;
  }

  /* Main Content */
  .center-text {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 50px;
    padding: 80px 20px;
    position: relative;
    z-index: 1;
  }

  #main-image {
    width: 90%;
    max-width: 600px;
    height: auto;
    object-fit: contain;
  }

  /* Footer */
  footer {
    width: 100%;
    text-align: center;
    padding: 40px 0 50px 0;
    font-size: 16px;
    position: relative;
    z-index: 1;
  }

  #contact-image {
    height: 80px;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.3s ease;
  }

  #contact-image:hover {
    opacity: 1;
  }

  /* Dark Mode */
  body.dark-mode {
    background: #0a0a0a;
    color: #f0f0f0;
  }

  /* Cart Sidebar */
  .cart-dropdown {
    position: fixed;
    top: 0;
    right: -480px;
    width: 480px;
    height: 100vh;
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(20px);
    color: #1a1a1a;
    z-index: 1100;
    display: flex;
    flex-direction: column;
    padding: 40px;
    transition: right 0.4s ease;
    box-sizing: border-box;
    overflow-y: auto;
    box-shadow: -4px 0 30px rgba(0, 0, 0, 0.1);
  }

  body.dark-mode .cart-dropdown {
    background: rgba(20, 20, 20, 0.97);
    color: #f0f0f0;
    box-shadow: -4px 0 30px rgba(0, 0, 0, 0.5);
  }

  .cart-dropdown.show {
    right: 0;
  }

  .cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }

  body.dark-mode .cart-header {
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .cart-dropdown h2 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .close-cart {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.05);
    border: none;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
    color: #1a1a1a;
  }

  .close-cart:hover {
    background: rgba(0, 0, 0, 0.1);
  }

  body.dark-mode .close-cart {
    background: rgba(255, 255, 255, 0.05);
    color: #f0f0f0;
  }

  body.dark-mode .close-cart:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  #cart-items {
    flex: 1;
    overflow-y: auto;
    padding-right: 10px;
    margin-bottom: 20px;
  }

  #cart-items::-webkit-scrollbar {
    width: 6px;
  }

  #cart-items::-webkit-scrollbar-track {
    background: transparent;
  }

  #cart-items::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.12);
    border-radius: 3px;
  }

  body.dark-mode #cart-items::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
  }

  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 18px;
    background: rgba(0, 0, 0, 0.02);
    border-radius: 12px;
    font-size: 16px;
    border: 1px solid rgba(0, 0, 0, 0.04);
  }

  body.dark-mode .cart-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .cart-item-info {
    flex: 1;
    margin-right: 20px;
  }

  .cart-item-name {
    font-weight: 600;
    margin-bottom: 4px;
    font-size: 16px;
  }

  .cart-item-price {
    color: #666;
    font-size: 14px;
  }

  body.dark-mode .cart-item-price {
    color: #999;
  }

  .cart-item button {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid rgba(0, 0, 0, 0.15);
    font-weight: 600;
    cursor: pointer;
    color: #666;
    font-size: 18px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .cart-item button:hover {
    background: #1a1a1a;
    color: white;
    border-color: #1a1a1a;
  }

  body.dark-mode .cart-item button {
    border-color: rgba(255, 255, 255, 0.15);
    color: #999;
  }

  body.dark-mode .cart-item button:hover {
    background: #f0f0f0;
    color: #1a1a1a;
    border-color: #f0f0f0;
  }

  .empty-cart {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    font-size: 16px;
  }

  .cart-total {
    padding: 25px 0;
    border-top: 1px solid rgba(0, 0, 0, 0.08);
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    margin-bottom: 25px;
  }

  body.dark-mode .cart-total {
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .cart-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    font-weight: 600;
  }

  .checkout-btn-wrapper {
    display: flex;
    justify-content: center;
  }

  .checkout-btn {
    display: block;
    height: 75px;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 0;
    background: transparent;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .checkout-btn:hover {
    opacity: 1;
  }

  /* Overlay */
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0);
    z-index: 99;
    display: none;
    transition: background 0.3s ease;
  }

  .overlay.show {
    display: block;
    background: rgba(0, 0, 0, 0.4);
  }

  body.dark-mode .overlay.show {
    background: rgba(0, 0, 0, 0.6);
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  /* Mobile Responsive */
  @media (max-width: 768px) {
    header {
      padding: 20px 25px;
    }

    header.scrolled {
      padding: 15px 25px;
    }

    .cart-dropdown {
      width: 90%;
      right: -90%;
      padding: 30px 25px;
    }

    .cart-dropdown.show {
      right: 0;
    }

    #cart-wrapper {
      right: 25px;
      top: 24px;
    }

    #cart {
      height: 36px;
    }

    #toggle-mode {
      left: 25px;
      top: 24px;
      height: 40px;
    }

    #logo {
      height: 70px;
    }

    header.scrolled #logo {
      height: 55px;
    }

    .center-text {
      padding: 50px 20px;
      gap: 40px;
    }

    #main-image {
      max-width: 450px;
    }

    #contact-image {
      height: 70px;
    }
  }

  @media (max-width: 480px) {
    #logo {
      height: 60px;
    }

    header.scrolled #logo {
      height: 50px;
    }

    .center-text {
      padding: 40px 15px;
    }

    #main-image {
      max-width: 350px;
    }
  }
</style>
</head>
<body>
<header id="header">
  <img id="toggle-mode" src="inseam/togglemode-black.png" alt="Toggle Mode" onclick="toggleMode()" />
  <a href="/"><img id="logo" src="inseam/black-text.png" alt="INSEAM Logo" /></a>
</header>

<div class="center-text">
  <img id="main-image" src="inseam/newproductsoon.png" alt="Coming Soon" />
</div>

<footer>
  <img id="contact-image" src="inseam/black-contact.png" alt="Contact" />
</footer>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="toggleCartDropdown()"></div>

<!-- Cart Sidebar -->
<div class="cart-dropdown" id="cart-dropdown">
  <div class="cart-header">
    <h2>Your Cart</h2>
    <button class="close-cart" onclick="toggleCartDropdown()">×</button>
  </div>
  <div id="cart-items"></div>
  <div class="cart-total" id="cart-total-section" style="display: none;">
    <div class="cart-total-row">
      <span>Total:</span>
      <span id="cart-total">$0.00</span>
    </div>
  </div>
  <div class="checkout-btn-wrapper">
    <img id="checkout-btn" class="checkout-btn" src="inseam/checkout-black.png" alt="Checkout" onclick="checkout()" />
  </div>
</div>

<!-- Cart Button with Badge -->
<div id="cart-wrapper" onclick="toggleCartDropdown()">
  <img id="cart" src="inseam/cart-black.png" alt="Cart" />
  <div id="cart-count">0</div>
</div>

<script>
let stripe;
let cart = JSON.parse(localStorage.getItem('cart')) || [];

window.addEventListener('load', () => {
  if (typeof Stripe !== 'undefined') {
    stripe = Stripe('pk_live_51ScAKaRc59K7q31ky52DyGd5VyIUWsTLCAQr3n5anDO48Uwpca7NZPIyfRzivdIP152ggxRwzcuM9I2jEBK4B2hp00buSwoxMx');
  }
});

// Header scroll effect
window.addEventListener('scroll', () => {
  const header = document.getElementById('header');
  if (window.pageYOffset > 50) {
    header.classList.add('scrolled');
  } else {
    header.classList.remove('scrolled');
  }
});

function toggleMode() {
  const isDark = document.body.classList.toggle('dark-mode');
  localStorage.setItem('darkMode', isDark ? 'true' : 'false');
  updateImages(isDark);
}

function updateImages(isDark) {
  document.getElementById('logo').src = isDark ? 'inseam/white-text.png' : 'inseam/black-text.png';
  document.getElementById('main-image').src = isDark ? 'inseam/newproductsoon-white.png' : 'inseam/newproductsoon.png';
  document.getElementById('contact-image').src = isDark ? 'inseam/white-contact.png' : 'inseam/black-contact.png';
  document.getElementById('toggle-mode').src = isDark ? 'inseam/togglemode-white.png' : 'inseam/togglemode-black.png';
  document.getElementById('cart').src = isDark ? 'inseam/cart-white.png' : 'inseam/cart-black.png';
  document.getElementById('checkout-btn').src = isDark ? 'inseam/checkout-white.png' : 'inseam/checkout-black.png';
}

function updateCartCount() {
  const badge = document.getElementById('cart-count');
  const count = cart.length;
  badge.textContent = count;
  badge.classList.toggle('show', count > 0);
}

function calculateTotal() {
  return cart.reduce((sum, item) => sum + parseFloat(item.price), 0).toFixed(2);
}

function renderCartDropdown() {
  const container = document.getElementById('cart-items');
  const totalSection = document.getElementById('cart-total-section');
  const totalDisplay = document.getElementById('cart-total');

  container.innerHTML = '';

  if (cart.length === 0) {
    container.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
    totalSection.style.display = 'none';
    return;
  }

  totalSection.style.display = 'block';
  totalDisplay.textContent = `$${calculateTotal()}`;

  cart.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">$${item.price}</div>
      </div>
      <button onclick="removeItem(${index})" aria-label="Remove item">×</button>
    `;
    container.appendChild(div);
  });
}

function removeItem(index) {
  cart.splice(index, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCartDropdown();
  updateCartCount();
}

function toggleCartDropdown() {
  const dropdown = document.getElementById('cart-dropdown');
  const overlay = document.getElementById('overlay');

  renderCartDropdown();
  dropdown.classList.toggle('show');
  overlay.classList.toggle('show');
  document.body.style.overflow = dropdown.classList.contains('show') ? 'hidden' : '';
}

function checkout() {
  if (cart.length === 0) {
    alert('Your cart is empty.');
    return;
  }

  if (!stripe) {
    alert('Payment system is loading. Please try again in a moment.');
    return;
  }

  fetch('http://localhost:3000/create-checkout-session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ items: cart })
  }).then(res => res.json())
    .then(session => stripe.redirectToCheckout({ sessionId: session.id }))
    .then(result => { if (result.error) alert(result.error.message); })
    .catch(err => console.error(err));
}

window.onload = () => {
  const darkMode = localStorage.getItem('darkMode') === 'true';
  if (darkMode) document.body.classList.add('dark-mode');
  updateImages(darkMode);
  updateCartCount();
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const dropdown = document.getElementById('cart-dropdown');
    const overlay = document.getElementById('overlay');
    if (dropdown.classList.contains('show')) {
      dropdown.classList.remove('show');
      overlay.classList.remove('show');
      document.body.style.overflow = '';
    }
  }
});
</script>
</body>
</html>
