<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>inse.am</title>
<link rel="icon" type="image/png" href="inseam/tabicon.png" />
<script src="https://js.stripe.com/v3/"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: linear-gradient(135deg, #fafafa 0%, #f0f0f0 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    color: #1a1a1a;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 135, 135, 0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Keyframe Animations */
  @keyframes fadeInDown {
    from {
      opacity: 0;
      transform: translateY(-40px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(40px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes scaleIn {
    from {
      opacity: 0;
      transform: scale(0.85);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  @keyframes slideInLeft {
    from {
      opacity: 0;
      transform: translateX(-60px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  @keyframes slideInRight {
    from {
      opacity: 0;
      transform: translateX(60px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  @keyframes float {
    0%, 100% { 
      transform: translateY(0px); 
    }
    50% { 
      transform: translateY(-15px); 
    }
  }

  @keyframes pulse {
    0%, 100% { 
      transform: scale(1); 
    }
    50% { 
      transform: scale(1.08); 
    }
  }

  @keyframes shimmer {
    0% {
      background-position: -1000px 0;
    }
    100% {
      background-position: 1000px 0;
    }
  }

  @keyframes cartBounce {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.2); }
    50% { transform: scale(0.95); }
    75% { transform: scale(1.1); }
  }

  /* Header */
  header {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 60px;
    position: sticky;
    top: 0;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px) saturate(180%);
    z-index: 100;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    animation: fadeInDown 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  header.scrolled {
    padding: 20px 60px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
  }
  
  body.dark-mode header { 
    background: rgba(15, 15, 15, 0.85);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
  }

  /* Mode Toggle */
  #toggle-mode { 
    height: 44px; 
    position: absolute; 
    left: 60px; 
    cursor: pointer;
    z-index: 101;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
    animation: slideInLeft 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.2s both;
  }

  #toggle-mode:hover { 
    transform: scale(1.2) rotate(180deg);
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.15));
  }

  #toggle-mode:active {
    transform: scale(0.9);
  }

  /* Logo */
  #logo { 
    height: 90px; 
    max-width: 550px;
    width: auto;
    object-fit: contain;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
    animation: scaleIn 1s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both;
    cursor: pointer;
  }

  #logo:hover {
    transform: scale(1.05);
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.12));
  }

  header.scrolled #logo {
    height: 70px;
  }

  /* Cart Badge */
  #cart-wrapper {
    position: fixed;
    top: 32px; 
    right: 60px; 
    z-index: 101;
    animation: slideInRight 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.2s both;
  }

  #cart {
    height: 40px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
  }

  #cart:hover { 
    transform: scale(1.2);
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.15));
  }

  #cart:active {
    transform: scale(0.9);
  }

  #cart-count {
    position: absolute;
    top: -8px;
    right: -8px;
    background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
    color: white;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    opacity: 0;
    transform: scale(0);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
  }

  #cart-count.show {
    opacity: 1;
    transform: scale(1);
    animation: cartBounce 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Main Content */
  .center-text {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 50px;
    padding: 80px 20px;
    position: relative;
    z-index: 1;
  }

  #main-image {
    width: 90%;
    max-width: 600px;
    height: auto;
    object-fit: contain;
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.1));
    animation: fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1) 0.5s both;
  }

  #main-image:hover {
    transform: scale(1.05) translateY(-10px);
    filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.15));
  }

  /* Footer */
  footer { 
    width: 100%; 
    text-align: center; 
    padding: 40px 0 50px 0; 
    font-size: 16px;
    animation: fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1) 0.8s both;
    position: relative;
    z-index: 1;
  }

  #contact-image {
    height: 80px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.1));
    cursor: pointer;
  }

  #contact-image:hover {
    transform: scale(1.15) translateY(-5px);
    filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.15));
  }

  /* Dark Mode */
  body.dark-mode { 
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
    color: #f0f0f0; 
  }

  body.dark-mode::before {
    background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 135, 135, 0.08) 0%, transparent 50%);
  }

  /* Cart Sidebar */
  .cart-dropdown {
    position: fixed;
    top: 0;
    right: -480px;
    width: 480px;
    height: 100vh;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(30px) saturate(180%);
    color: #1a1a1a;
    z-index: 1100;
    display: flex;
    flex-direction: column;
    padding: 40px;
    transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s ease;
    box-sizing: border-box;
    overflow-y: auto;
    box-shadow: -8px 0 50px rgba(0, 0, 0, 0.15);
  }
  
  body.dark-mode .cart-dropdown { 
    background: rgba(20, 20, 20, 0.95);
    color: #f0f0f0;
    box-shadow: -8px 0 50px rgba(0, 0, 0, 0.6);
  }

  .cart-dropdown.show { 
    right: 0;
  }

  .cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid rgba(0, 0, 0, 0.08);
  }

  body.dark-mode .cart-header {
    border-bottom: 2px solid rgba(255, 255, 255, 0.08);
  }

  .cart-dropdown h2 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  body.dark-mode .cart-dropdown h2 {
    background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .close-cart {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.05);
    border: none;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    color: #1a1a1a;
  }

  .close-cart:hover {
    background: rgba(0, 0, 0, 0.1);
    transform: rotate(90deg) scale(1.1);
  }

  body.dark-mode .close-cart {
    background: rgba(255, 255, 255, 0.05);
    color: #f0f0f0;
  }

  body.dark-mode .close-cart:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  #cart-items {
    flex: 1;
    overflow-y: auto;
    padding-right: 10px;
    margin-bottom: 20px;
  }

  #cart-items::-webkit-scrollbar {
    width: 8px;
  }

  #cart-items::-webkit-scrollbar-track {
    background: transparent;
  }

  #cart-items::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.15);
    border-radius: 4px;
  }

  #cart-items::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 0, 0, 0.25);
  }

  body.dark-mode #cart-items::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
  }

  body.dark-mode #cart-items::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.25);
  }

  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 20px;
    background: linear-gradient(135deg, rgba(0, 0, 0, 0.02) 0%, rgba(0, 0, 0, 0.04) 100%);
    border-radius: 16px;
    font-size: 16px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(0, 0, 0, 0.05);
  }

  body.dark-mode .cart-item {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.05) 100%);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  @keyframes slideIn {
    from {
      transform: translateX(30px);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
    }
  }

  .cart-item:hover {
    background: linear-gradient(135deg, rgba(0, 0, 0, 0.04) 0%, rgba(0, 0, 0, 0.08) 100%);
    transform: translateX(-8px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
  }

  body.dark-mode .cart-item:hover {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.08) 100%);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  }

  .cart-item-info {
    flex: 1;
    margin-right: 20px;
  }

  .cart-item-name {
    font-weight: 600;
    margin-bottom: 4px;
    font-size: 16px;
  }

  .cart-item-price {
    color: #666;
    font-size: 14px;
  }

  body.dark-mode .cart-item-price {
    color: #999;
  }
  
  .cart-item button { 
    flex-shrink: 0; 
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(220, 38, 38, 0.1) 100%);
    border: 1px solid rgba(239, 68, 68, 0.2);
    font-weight: 600; 
    cursor: pointer; 
    color: #dc2626; 
    font-size: 20px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .cart-item button:hover {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    color: white;
    transform: rotate(90deg) scale(1.15);
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
    border-color: transparent;
  }

  .empty-cart {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    font-size: 18px;
  }

  .cart-total {
    padding: 25px 0;
    border-top: 2px solid rgba(0, 0, 0, 0.08);
    border-bottom: 2px solid rgba(0, 0, 0, 0.08);
    margin-bottom: 25px;
  }

  body.dark-mode .cart-total {
    border-top: 2px solid rgba(255, 255, 255, 0.08);
    border-bottom: 2px solid rgba(255, 255, 255, 0.08);
  }

  .cart-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 22px;
    font-weight: 600;
  }

  .checkout-btn-wrapper {
    display: flex;
    justify-content: center;
  }
  
  .checkout-btn {
    display: block;
    height: 75px;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 0;
    background: transparent;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.12));
  }
  
  .checkout-btn:hover { 
    transform: scale(1.08) translateY(-2px);
    filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.2));
  }

  .checkout-btn:active {
    transform: scale(0.95);
  }

  /* Overlay */
  .overlay {
    position: fixed;
    top: 0; 
    left: 0;
    width: 100%; 
    height: 100%;
    background: rgba(0, 0, 0, 0);
    z-index: 99;
    display: none;
    transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(0px);
  }
  
  .overlay.show { 
    display: block; 
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
  }

  body.dark-mode .overlay.show {
    background: rgba(0, 0, 0, 0.75);
  }

  a { 
    color: inherit; 
    text-decoration: none;
  }

  /* Mobile Responsive */
  @media (max-width: 768px) {
    header {
      padding: 20px 25px;
    }

    header.scrolled {
      padding: 15px 25px;
    }

    .cart-dropdown {
      width: 90%;
      right: -90%;
      padding: 30px 25px;
    }
    
    .cart-dropdown.show {
      right: 0;
    }
    
    #cart-wrapper {
      right: 25px;
      top: 24px;
    }

    #cart {
      height: 36px;
    }
    
    #toggle-mode { 
      left: 25px;
      top: 24px;
      height: 40px;
    }
    
    #logo {
      height: 70px;
    }

    header.scrolled #logo {
      height: 55px;
    }
    
    .center-text { 
      padding: 50px 20px;
      gap: 40px;
    }

    #main-image {
      max-width: 450px;
    }

    #contact-image {
      height: 70px;
    }

    .cart-dropdown h2 {
      font-size: 24px;
    }

    .cart-item {
      padding: 16px;
    }
  }

  @media (max-width: 480px) {
    #logo {
      height: 60px;
    }

    header.scrolled #logo {
      height: 50px;
    }

    .center-text {
      padding: 40px 15px;
    }

    #main-image {
      max-width: 350px;
    }

    .cart-dropdown h2 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>
<header id="header">
  <img id="toggle-mode" src="inseam/togglemode-black.png" alt="Toggle Mode" onclick="toggleMode()" />
  <a href="/"><img id="logo" src="inseam/black-text.png" alt="INSEAM Logo" /></a>
</header>

<div class="center-text">
  <img id="main-image" src="inseam/newproductsoon.png" alt="Coming Soon" />
</div>

<footer>
  <img id="contact-image" src="inseam/black-contact.png" alt="Contact" />
</footer>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="toggleCartDropdown()"></div>

<!-- Cart Sidebar -->
<div class="cart-dropdown" id="cart-dropdown">
  <div class="cart-header">
    <h2>Your Cart</h2>
    <button class="close-cart" onclick="toggleCartDropdown()">×</button>
  </div>
  <div id="cart-items"></div>
  <div class="cart-total" id="cart-total-section" style="display: none;">
    <div class="cart-total-row">
      <span>Total:</span>
      <span id="cart-total">$0.00</span>
    </div>
  </div>
  <div class="checkout-btn-wrapper">
    <img id="checkout-btn" class="checkout-btn" src="inseam/checkout-black.png" alt="Checkout" onclick="checkout()" />
  </div>
</div>

<!-- Cart Button with Badge -->
<div id="cart-wrapper" onclick="toggleCartDropdown()">
  <img id="cart" src="inseam/cart-black.png" alt="Cart" />
  <div id="cart-count">0</div>
</div>

<script>
let stripe;
let cart = JSON.parse(localStorage.getItem('cart')) || [];

// Initialize Stripe when script loads
window.addEventListener('load', () => {
  if (typeof Stripe !== 'undefined') {
    stripe = Stripe('pk_live_51ScAKaRc59K7q31ky52DyGd5VyIUWsTLCAQr3n5anDO48Uwpca7NZPIyfRzivdIP152ggxRwzcuM9I2jEBK4B2hp00buSwoxMx');
  }
});

// Header scroll effect
let lastScroll = 0;
window.addEventListener('scroll', () => {
  const header = document.getElementById('header');
  const currentScroll = window.pageYOffset;
  
  if (currentScroll > 50) {
    header.classList.add('scrolled');
  } else {
    header.classList.remove('scrolled');
  }
  
  lastScroll = currentScroll;
});

// Dark mode toggle with smooth transition
function toggleMode() {
  const isDark = document.body.classList.toggle('dark-mode');
  localStorage.setItem('darkMode', isDark ? 'true' : 'false');
  updateImages(isDark);
}

function updateImages(isDark) {
  const images = {
    logo: isDark ? 'inseam/white-text.png' : 'inseam/black-text.png',
    main: isDark ? 'inseam/newproductsoon-white.png' : 'inseam/newproductsoon.png',
    contact: isDark ? 'inseam/white-contact.png' : 'inseam/black-contact.png',
    toggle: isDark ? 'inseam/togglemode-white.png' : 'inseam/togglemode-black.png',
    cart: isDark ? 'inseam/cart-white.png' : 'inseam/cart-black.png',
    checkout: isDark ? 'inseam/checkout-white.png' : 'inseam/checkout-black.png'
  };

  document.getElementById('logo').src = images.logo;
  document.getElementById('main-image').src = images.main;
  document.getElementById('contact-image').src = images.contact;
  document.getElementById('toggle-mode').src = images.toggle;
  document.getElementById('cart').src = images.cart;
  document.getElementById('checkout-btn').src = images.checkout;
}

// Update cart count badge
function updateCartCount() {
  const badge = document.getElementById('cart-count');
  const count = cart.length;
  badge.textContent = count;
  
  if (count > 0) {
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

// Calculate cart total
function calculateTotal() {
  return cart.reduce((sum, item) => sum + parseFloat(item.price), 0).toFixed(2);
}

// Render cart items
function renderCartDropdown() {
  const container = document.getElementById('cart-items');
  const totalSection = document.getElementById('cart-total-section');
  const totalDisplay = document.getElementById('cart-total');
  
  container.innerHTML = '';
  
  if (cart.length === 0) {
    container.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
    totalSection.style.display = 'none';
    return;
  }
  
  totalSection.style.display = 'block';
  totalDisplay.textContent = `$${calculateTotal()}`;
  
  cart.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.style.animationDelay = `${index * 0.05}s`;
    div.innerHTML = `
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">$${item.price}</div>
      </div>
      <button onclick="removeItem(${index})" aria-label="Remove item">×</button>
    `;
    container.appendChild(div);
  });
}

// Remove item with animation
function removeItem(index) {
  const items = document.querySelectorAll('.cart-item');
  const item = items[index];
  
  item.style.animation = 'slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) reverse';
  
  setTimeout(() => {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCartDropdown();
    updateCartCount();
  }, 300);
}

// Toggle cart sidebar with overlay
function toggleCartDropdown() {
  const dropdown = document.getElementById('cart-dropdown');
  const overlay = document.getElementById('overlay');

  renderCartDropdown();
  dropdown.classList.toggle('show');
  overlay.classList.toggle('show');
  
  // Prevent body scroll when cart is open
  if (dropdown.classList.contains('show')) {
    document.body.style.overflow = 'hidden';
  } else {
    document.body.style.overflow = '';
  }
}

// Checkout
function checkout() {
  if(cart.length === 0){ 
    alert('Your cart is empty.'); 
    return; 
  }
  
  if (!stripe) {
    alert('Payment system is loading. Please try again in a moment.');
    return;
  }
  
  fetch('http://localhost:3000/create-checkout-session',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({items:cart})
  }).then(res => res.json())
  .then(session => stripe.redirectToCheckout({sessionId:session.id}))
  .then(result => { if(result.error) alert(result.error.message) })
  .catch(err => console.error(err));
}

// Load dark mode and initialize on page load
window.onload = () => {
  const darkMode = localStorage.getItem('darkMode') === 'true';
  if(darkMode) document.body.classList.add('dark-mode');
  updateImages(darkMode);
  updateCartCount();
  
  // Add intersection observer for scroll animations
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = '1';
        entry.target.style.transform = 'translateY(0)';
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.center-text, footer').forEach(el => {
    observer.observe(el);
  });
}

// Close cart with Escape key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const dropdown = document.getElementById('cart-dropdown');
    const overlay = document.getElementById('overlay');
    if (dropdown.classList.contains('show')) {
      dropdown.classList.remove('show');
      overlay.classList.remove('show');
      document.body.style.overflow = '';
    }
  }
});
</script>
